<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码状态</title>
  
  <!-- ===== Bắt đầu: Thêm cho Thêm vào Màn hình chính ===== -->
  <link rel="icon" type="image/jpeg" href="icon.jpg">
  <link rel="apple-touch-icon" href="icon.jpg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="员工码">
  <meta name="application-name" content="员工码">
  <!-- ===== Kết thúc: Thêm cho Thêm vào Màn hình chính ===== -->
  
  <style>
    :root {
      --green: #82d58b;
      --text: #111;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      min-height: 100vh;
      overflow: hidden;
      background-color: #242536;
      background-image: url("bg.JPG");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      font-family: Arial, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
    }
    .top-time {
      position: absolute;
      top: 27.7%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text);
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      font-size: clamp(20px, 5.2vw, 28px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .status-box {
      position: absolute;
      top: 64%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: center;
    }
    .status-label {
      color: var(--green);
      font-size: clamp(27px, 7vw, 36px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 1px;
      white-space: nowrap;
      animation: blink 2s steps(1, end) infinite;
    }
    .elapsed {
      margin-top: 4px;
      color: var(--green);
      font-size: clamp(25px, 6.3vw, 34px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: 0;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    @keyframes blink {
      0%, 49.999% { visibility: visible; }
      50%, 100% { visibility: hidden; }
    }
    @media (prefers-reduced-motion: reduce) {
      .status-label { animation: none; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="top-time" id="realTime">2026-10-23 08:40:29</div>
    <section class="status-box" aria-label="状态与计时">
      <div class="status-label">已生效</div>
      <div class="elapsed" id="elapsedTime">00:00:00</div>
    </section>
  </main>
  <script>
    const realTimeEl = document.getElementById("realTime");
    const elapsedEl = document.getElementById("elapsedTime");
    function pad(value) {
      return String(value).padStart(2, "0");
    }
    function getLocalDateKey(date) {
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }
    function updateRealTime() {
      const now = new Date();
      realTimeEl.textContent =
        `${getLocalDateKey(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    function getStartTime(now) {
      const dateKey = getLocalDateKey(now);
      const storageKey = `statusTimerStart-${dateKey}`;
      try {
        let start = localStorage.getItem(storageKey);
        if (!start) {
          start = String(now.getTime());
          localStorage.setItem(storageKey, start);
        }
        return Number(start);
      } catch (error) {
        if (!window.sessionStartTime) window.sessionStartTime = now.getTime();
        return window.sessionStartTime;
      }
    }
    function updateElapsedTime() {
      const now = new Date();
      const start = getStartTime(now);
      const totalSeconds = Math.max(0, Math.floor((now.getTime() - start) / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      elapsedEl.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }
    function tick() {
      updateRealTime();
      updateElapsedTime();
    }
    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
