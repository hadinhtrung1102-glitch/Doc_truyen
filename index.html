<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Trung — HSK & Lộ Trình</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root {
            --primary: #d32f2f; --secondary: #f57c00; --success: #2e7d32;
            --light: #fff8f0; --card: #fff; --border: #e8e0d8; --text: #333;
        }
        body { background: var(--light); min-height: 100vh; color: var(--text); padding-bottom: 80px; }
        header {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: white; padding: 1.2rem; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        header h1 { font-size: 1.5rem; margin-bottom: 0.2rem; }
        .progress-bar {
            background: rgba(255,255,255,0.25); border-radius: 10px; height: 8px;
            margin-top: 0.6rem; overflow: hidden;
        }
        .progress-fill {
            background: #fff; height: 100%; width: 0%; border-radius: 10px;
            transition: width 0.4s ease;
        }
        .container { max-width: 700px; margin: 0 auto; padding: 1rem; }
        .section {
            background: var(--card); border-radius: 14px; padding: 1.2rem;
            margin-bottom: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }
        .section-title { font-size: 1.1rem; color: var(--primary); margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.4rem; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
        .btn {
            padding: 0.8rem 0.6rem; border-radius: 8px; border: none; font-size: 0.9rem;
            cursor: pointer; transition: all 0.2s; text-align: center; font-weight: 500;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn.active { box-shadow: inset 0 0 0 2px currentColor; }
        .btn-hsk { background: #e8f5e9; color: #2e7d32; }
        .btn-hsk.active { background: #2e7d32; color: #fff; }
        .btn-skill { background: #e3f2fd; color: #1565c0; }
        .btn-skill.active { background: #1565c0; color: #fff; }
        .btn-topic { background: #f3e5f5; color: #7b1fa2; }
        .btn-topic.active { background: #7b1fa2; color: #fff; }
        .action-buttons { display: flex; gap: 0.6rem; margin-top: 1rem; }
        .btn-primary { background: var(--primary); color: white; flex: 1; font-weight: 600; }
        .btn-secondary { background: #e0e0e0; color: #444; flex: 1; }

        /* === Khu vực học === */
        .learning-area { display: none; }
        .learning-area.active { display: block; }
        .back-btn {
            background: none; border: none; color: var(--primary); font-size: 0.95rem;
            cursor: pointer; padding: 0.4rem 0; margin-bottom: 0.8rem; display: inline-flex;
            align-items: center; gap: 0.3rem;
        }
        .day-card {
            border: 1px solid var(--border); border-radius: 10px; padding: 1rem;
            margin-bottom: 0.8rem; transition: all 0.25s;
        }
        .day-card.completed { background: #f0f9f0; border-color: #a5d6a7; }
        .day-card.current { border-color: var(--secondary); box-shadow: 0 0 0 2px #ffe0b2; }
        .day-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0.6rem;
        }
        .day-title { font-weight: 600; font-size: 1rem; }
        .check-btn {
            background: #f0f0f0; border: none; border-radius: 50%; width: 32px; height: 32px;
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .check-btn.checked { background: var(--success); color: white; }
        .lesson-item {
            padding: 0.6rem 0.8rem; background: #f9f6f2; border-radius: 6px;
            margin-bottom: 0.5rem; font-size: 0.95rem; line-height: 1.6;
        }
        .vocab-card {
            background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
            padding: 0.8rem; margin-bottom: 0.6rem;
        }
        .vocab-chinese { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
        .vocab-pinyin { color: #f57c00; font-size: 0.9rem; margin: 0.2rem 0; }
        .vocab-meaning { color: #444; font-size: 0.95rem; }
        .empty { text-align: center; color: #999; padding: 2rem; }

        nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: white;
            display: flex; box-shadow: 0 -2px 8px rgba(0,0,0,0.08); z-index: 100;
        }
        nav button {
            flex: 1; padding: 0.7rem; border: none; background: none; cursor: pointer;
            font-size: 0.8rem; color: #777; transition: all 0.2s;
        }
        nav button.active { color: var(--primary); border-top: 2px solid var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<header>

        </section>

        <!-- Chọn Kỹ năng -->

            <h2 class="section-title">🎯 Chọn Kỹ năng</h2>
            <p style="font-size:0.85rem; color:#777; margin-bottom:0.6rem;">Chọn một hoặc nhiều kỹ năng</p>
            <div class="grid">

                <button class="btn btn-skill" data-skill="noi">🗣️ Nói</button>

                <button class="btn btn-skill" data-skill="viet">✍️ Viết</button>
            </div>
        </section>

        <!-- Chọn Chủ đề -->
        <section class="section">
            <h2 class="section-title">🏷️ Chọn Chủ đề</h2>
            <div class="grid">
                <button class="btn btn-topic" data-topic="giaodien">💬 Giao tiếp</button>

                <button class="btn btn-topic" data-topic="amthuc">🍜 Ẩm thực</button>
            </div>
        </section>

        <div class="action-buttons">
            <button class="btn btn-secondary" id="resetBtn">🔄 Đặt lại</button>
            <button class="btn btn-primary" id="createBtn">✨ Tạo Lộ Trình Học</button>
        </div>
    </div>

    <!-- TAB 2: Lộ Trình & Học -->
    <div id="tabLearn" class="tab-content">
        <button class="back-btn" id="backBtn">← Quay lại tạo lộ trình</button>
        
        <section class="section">
            <h2 class="section-title" id="planTitle">📖 Lộ trình học của bạn</h2>
            <div id="planOverview"></div>
        </section>

        <section class="section">
            <h2 class="section-title">📅 Lịch học theo ngày</h2>
            <div id="dailyList"></div>
        </section>

        <!-- Khu vực học bài chi tiết -->
        <section class="section learning-area" id="lessonArea">
            <button class="back-btn" id="backToPlanBtn">← Quay lại lịch học</button>
            <h3 id="lessonTitle" style="color:var(--primary); margin-bottom:1rem;"></h3>
            <div id="lessonContent"></div>
        </section>
    </div>

</div>

<!-- Thanh điều hướng dưới -->
<nav>
    <button class="nav-btn active" data-tab="tabPlan">📋 Tạo Lộ Trình</button>

</nav>

// ===== TRẠNG THÁI =====
let state = {
    hsk: null,
    skills: [],
    topics: [],
    planCreated: false,
    currentTopic: null,
    completedLessons: {},
    currentLessonIndex: null
};

// Load tiến độ đã lưu
function loadProgress() {
    const saved = localStorage.getItem('hskLearningProgress');
    if (saved) {
        try {
            state.completedLessons = JSON.parse(saved);
        } catch {}
    }
    updateProgressUI();
}

function saveProgress() {
    localStorage.setItem('hskLearningProgress', JSON.stringify(state.completedLessons));
    updateProgressUI();
}

function updateProgressUI() {
    const totalLessons = getTotalLessons();
    const completed = Object.keys(state.completedLessons).length;
    const percent = totalLessons > 0 ? Math.round((completed / totalLessons) * 100) : 0;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').textContent = totalLessons > 0 
        ? `${completed}/${totalLessons} bài đã hoàn thành (${percent}%)` 
        : '';
}

function getTotalLessons() {
    if (!state.hsk || state.topics.length === 0) return 0;
    const hskData = BAI_HOC[state.hsk];
    let total = 0;
    state.topics.forEach(t => {
        if (hskData.chuDe[t]) total += hskData.chuDe[t].baiHoc.length;
    });
    return total;
}

// ===== CHỌN HSK / KỸ NĂNG / CHỦ ĐỀ =====
document.querySelectorAll('.btn-hsk').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-hsk').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.hsk = btn.dataset.hsk;
    });
});

document.querySelectorAll('.btn-skill').forEach(btn => {
    btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        const s = btn.dataset.skill;
        state.skills.includes(s) 
            ? state.skills = state.skills.filter(x => x !== s)
            : state.skills.push(s);
    });
});

document.querySelectorAll('.btn-topic').forEach(btn => {
    btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        const t = btn.dataset.topic;
        state.topics.includes(t)
            ? state.topics = state.topics.filter(x => x !== t)
            : state.topics.push(t);
    });
});

// ===== TẠO LỘ TRÌNH =====
document.getElementById('createBtn').addEventListener('click', () => {
    if (!state.hsk) return alert('⚠️ Vui lòng chọn trình độ HSK!');
    if (state.skills.length === 0) return alert('⚠️ Vui lòng chọn ít nhất 1 kỹ năng!');
    if (state.topics.length === 0) return alert('⚠️ Vui lòng chọn ít nhất 1 chủ đề!');
    
    state.planCreated = true;
    renderPlan();
    switchTab('tabLearn');
});

function renderPlan() {
    const hskData = BAI_HOC[state.hsk];
    document.getElementById('planTitle').textContent = `📖 ${hskData.ten}`;
    
    // Tổng quan
    document.getElementById('planOverview').innerHTML = `
        <p><strong>⏱ Thời gian dự kiến:</strong> ${hskData.thoiGian}</p>
        <p><strong>📝 Tổng số từ vựng:</strong> khoảng ${hskData.tongTuVung} từ</p>
        <p><strong>🎯 Kỹ năng học:</strong> ${state.skills.map(s => ({nghe:'Nghe',noi:'Nói',doc:'Đọc',viet:'Viết'})[s]).join(', ')}</p>
        <p><strong>🏷️ Chủ đề:</strong> ${state.topics.map(t => hskData.chuDe[t].ten).join(', ')}</p>
    `;
    
    // Danh sách ngày học
    let html = '';
    state.topics.forEach(topicKey => {
        const topic = hskData.chuDe[topicKey];
        html += `<h4 style="margin:1.2rem 0 0.6rem; color:#7b1fa2;">📌 ${topic.ten}</h4>`;
        
        topic.baiHoc.forEach((bai, idx) => {
            const lessonId = `${state.hsk}-${topicKey}-${idx}`;
            const isCompleted = !!state.completedLessons[lessonId];
            html += `
                <div class="day-card ${isCompleted ? 'completed' : ''}" data-topic="${topicKey}" data-index="${idx}" id="card-${lessonId}">
                    <div class="day-header">
                        <span class="day-title">${bai.ten}</span>
                        <button class="check-btn ${isCompleted ? 'checked' : ''}" data-id="${lessonId}">
                            ${isCompleted ? '✓' : ''}
                        </button>
                    </div>
                    <div style="font-size:0.85rem; color:#666;">
                        ${bai.tuVung.length} từ vựng • Nghe/Nói/Đọc/Viết
                    </div>
                </div>
            `;
