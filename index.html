<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V25060141 (Hà Đình Trung)</title>
    <link rel="icon" href="icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: url('background.jpg') no-repeat center center;
            background-size: 100% 100vh;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 22vh;
        }

        /* === Thời gian phía trên mã QR === */
        .datetime-top {
            font-size: 22px;
            color: #000000;
            background: #ffffff;
            padding: 4px 0;
            width: 320px;
            text-align: center;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* === Chữ "Đã có hiệu lực" tiếng Trung nhấp nháy === */
        .status-text {
            font-size: 22px;
            color: #4cd964;
            text-align: center;
            margin-top: 332px;
            animation: blink 2s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* === Bộ đếm thời gian === */
        .timer-count {
            font-size: 26px;
            color: #4cd964;
            font-weight: 600;
            text-align: center;
            margin-top: 4px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- Ngày giờ phía trên mã QR -->
    <div class="datetime-top" id="datetime">2026-10-22 23:54:55</div>

    <!-- Chữ tiếng Trung + Bộ đếm -->
    <div class="status-text">已生效</div>
    <div class="timer-count" id="timer">00:00</div>

    <script>
        // === CẬP NHẬT NGÀY GIỜ THỰC TẾ ===
        function updateDateTime() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('datetime').textContent = `${y}-${m}-${d} ${h}:${min}:${s}`;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // === BỘ ĐẾM BẮT ĐẦU TỪ KHI MỞ TRANG ===
        let start = Date.now();
        function updateTimer() {
            let elapsed = Math.floor((Date.now() - start) / 1000);
            let min = String(Math.floor(elapsed / 60)).padStart(2, '0');
            let sec = String(elapsed % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${min}:${sec}`;
        }
        setInterval(updateTimer, 1000);
    </script>
</body>
</html>
